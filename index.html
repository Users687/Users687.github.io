<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>projects</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#111b33;
      --text:#e7eefc;
      --muted:#a9b7dd;
      --accent:#6ea8fe;
      --accent2:#8b5cf6;
      --border:rgba(255,255,255,.10);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:16px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(110,168,254,.25), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(139,92,246,.22), transparent 55%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      padding: clamp(18px, 4vw, 36px) clamp(16px, 4vw, 44px) 10px;
      max-width:1100px;
      width:100%;
      margin:0 auto;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:240px;
    }
    .brand h1{
      margin:0;
      font-size: clamp(22px, 3.2vw, 34px);
      letter-spacing:.2px;
    }
    .brand p{
      margin:0;
      color:var(--muted);
      line-height:1.5;
      max-width:58ch;
      font-size: 14.5px;
    }

    main{
      flex:1;
      padding: 10px clamp(16px, 4vw, 44px) clamp(26px, 4vw, 44px);
      max-width:1100px;
      width:100%;
      margin:0 auto;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .card{
      grid-column: span 6;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      gap: 12px;
      min-height: 132px;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .card:hover{
      transform: translateY(-2px);
      border-color: rgba(110,168,254,.35);
      background: linear-gradient(180deg, rgba(110,168,254,.10), rgba(255,255,255,.02));
    }

    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
    }

    .site{
      display:flex;
      gap: 12px;
      align-items:flex-start;
    }

    .icon{
      width:40px;
      height:40px;
      border-radius: 12px;
      background: rgba(110,168,254,.14);
      border: 1px solid rgba(110,168,254,.25);
      display:grid;
      place-items:center;
      font-size: 18px;
      flex: 0 0 auto;
    }

    .site h2{
      margin:0;
      font-size: 16px;
      letter-spacing:.2px;
    }
    .site p{
      margin:4px 0 0;
      color:var(--muted);
      font-size: 13.5px;
      line-height: 1.45;
    }

    .pill{
      color: var(--muted);
      font-size: 12px;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
      background: rgba(0,0,0,.10);
    }

    .actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      margin-top:auto;
    }

    .btn{
      appearance:none;
      border: 1px solid rgba(110,168,254,.40);
      background: linear-gradient(90deg, rgba(110,168,254,.18), rgba(139,92,246,.18));
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 650;
      letter-spacing:.2px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: rgba(110,168,254,.65);
      background: linear-gradient(90deg, rgba(110,168,254,.25), rgba(139,92,246,.25));
    }
    .btn:active{ transform: translateY(0px); }

    footer{
      padding: 0 16px 22px;
      color: rgba(231,238,252,.70);
      text-align:center;
      font-size: 12.5px;
    }

    @media (max-width: 900px){
      .card{ grid-column: span 12; }
    }
  </style>
</head>
<body>
