<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e1b4b;
      --bg3: #312e81;
      --card: rgba(17, 24, 39, 0.9);
      --text: #f9fafb;
      --muted: #cbd5e1;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --button-bg: #f9fafb;
      --button-text: #111827;
    }

    body.light {
      --bg1: #dbeafe;
      --bg2: #ede9fe;
      --bg3: #c4b5fd;
      --card: rgba(255, 255, 255, 0.9);
      --text: #1f2937;
      --muted: #6b7280;
      --border: rgba(255, 255, 255, 0.45);
      --shadow: 0 12px 40px rgba(37, 99, 235, 0.14);
      --button-bg: #111827;
      --button-text: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      line-height: 1.6;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.45), transparent 35%),
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.45), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      background-attachment: fixed;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .toggle {
      border: 0;
      background: var(--button-bg);
      color: var(--button-text);
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.3s ease, color 0.3s ease;
    }

    .toggle:hover { transform: translateY(-1px); opacity: 0.95; }

    .hero, .section {
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .hero {
      padding: 48px 28px;
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.25rem);
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .section {
      padding: 24px;
      margin-bottom: 24px;
      position: relative;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }

    .section p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .iframe-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 560 / 530;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Fullscreen button (small) */
    .fs-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      background: rgba(17, 24, 39, 0.78);
      color: #fff;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.3s ease;
      user-select: none;
    }

    body.light .fs-btn {
      background: rgba(17, 24, 39, 0.9);
      color: #fff;
    }

    .fs-btn:hover { transform: translateY(-1px); opacity: 0.95; }

    /* Play button (center) */
    .iframe-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;

      /* Nice dark gradient placeholder */
      background:
        radial-gradient(circle at 18% 22%, rgba(59, 130, 246, 0.40), transparent 48%),
        radial-gradient(circle at 82% 10%, rgba(168, 85, 247, 0.30), transparent 45%),
        radial-gradient(circle at 55% 90%, rgba(99, 102, 241, 0.38), transparent 55%),
        linear-gradient(135deg, rgba(2, 6, 23, 0.90), rgba(30, 27, 75, 0.82));

      /* subtle depth */
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* Optional: slightly nicer in light mode too */
    body.light .iframe-placeholder {
      background:
        radial-gradient(circle at 18% 22%, rgba(59, 130, 246, 0.22), transparent 48%),
        radial-gradient(circle at 82% 10%, rgba(168, 85, 247, 0.18), transparent 45%),
        radial-gradient(circle at 55% 90%, rgba(99, 102, 241, 0.22), transparent 55%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(237, 233, 254, 0.90));

      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
    }

    .play-btn {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      padding: 14px 22px;
      font-weight: 800;
      letter-spacing: 0.01em;
      background: rgba(17, 24, 39, 0.78);
      color: #fff;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.3s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      position: relative;
      z-index: 2;
    }

    body.light .play-btn {
      background: rgba(17, 24, 39, 0.9);
      color: #fff;
    }

    .play-btn:hover { transform: translateY(-1px); opacity: 0.95; }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid #fff;
    }

    @media (max-width: 640px) {
      .container { padding: 16px 14px 40px; }
      .hero, .section { padding: 20px; }
      .topbar { margin-bottom: 14px; }
      .fs-btn { top: 8px; right: 8px; padding: 6px 9px; }
      .play-btn { padding: 12px 18px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <button class="toggle" id="themeToggle" type="button">Light mode</button>
    </div>

    <section class="hero">
      <h1>Welcome to my website</h1>
      <p class="subtitle">random tools and stuff.</p>
    </section>

    <section class="section">
      <h2>Tic tac my toes</h2>
      <div class="iframe-wrap">
        <button class="fs-btn" type="button" data-iframe-fullscreen>Fullscreen</button>

        <div class="iframe-placeholder">
          <button class="play-btn" type="button" data-iframe-play data-iframe-src="https://eg155.github.io/tic-tac-toe.html">
            <span class="play-icon" aria-hidden="true"></span>
            Play
          </button>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Pig-latin Translator</h2>
      <div class="iframe-wrap">
        <button class="fs-btn" type="button" data-iframe-fullscreen>Fullscreen</button>

        <div class="iframe-placeholder">
          <button class="play-btn" type="button" data-iframe-play data-iframe-src="https://eg155.github.io/piglatin_translator.html">
            <span class="play-icon" aria-hidden="true"></span>
            Play
          </button>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Calcuator tool</h2>
      <div class="iframe-wrap">
        <button class="fs-btn" type="button" data-iframe-fullscreen>Fullscreen</button>

        <div class="iframe-placeholder">
          <button class="play-btn" type="button" data-iframe-play data-iframe-src="https://eg155.github.io/css-calc.html">
            <span class="play-icon" aria-hidden="true"></span>
            Play
          </button>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Random password gen</h2>
      <div class="iframe-wrap">
        <button class="fs-btn" type="button" data-iframe-fullscreen>Fullscreen</button>

        <div class="iframe-placeholder">
          <button class="play-btn" type="button" data-iframe-play data-iframe-src="https://eg155.github.io/randomPassword.html">
            <span class="play-icon" aria-hidden="true"></span>
            Play
          </button>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>DOOM running in browser on school chromebook is INSANE/</h2>
      <div class="iframe-wrap">
        <button class="fs-btn" type="button" data-iframe-fullscreen>Fullscreen</button>

        <div class="iframe-placeholder">
          <button class="play-btn" type="button" data-iframe-play data-iframe-src="https://eg155.github.io/doomdos.html">
            <span class="play-icon" aria-hidden="true"></span>
            Play
          </button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const toggle = document.getElementById('themeToggle');
    const body = document.body;

    function updateButton() {
      toggle.textContent = body.classList.contains('light') ? 'Dark mode' : 'Light mode';
    }

    toggle.addEventListener('click', () => {
      body.classList.toggle('light');
      updateButton();
    });

    updateButton();

    function ensureIframeLoaded(wrap) {
      const existing = wrap.querySelector('iframe');
      if (existing) return existing;

      const playBtn = wrap.querySelector('[data-iframe-play]');
      if (!playBtn) return null;

      const src = playBtn.getAttribute('data-iframe-src');
      if (!src) return null;

      const iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';

      wrap.appendChild(iframe);

      const placeholder = wrap.querySelector('.iframe-placeholder');
      if (placeholder) placeholder.remove();

      return iframe;
    }

    // Play button per iframe (lazy-load)
    document.querySelectorAll('[data-iframe-play]').forEach(btn => {
      btn.addEventListener('click', () => {
        const wrap = btn.closest('.iframe-wrap');
        if (!wrap) return;
        ensureIframeLoaded(wrap);
      });
    });

    // Fullscreen per section (per iframe)
    document.querySelectorAll('[data-iframe-fullscreen]').forEach(btn => {
      btn.addEventListener('click', () => {
        const wrap = btn.closest('.iframe-wrap');
        const iframe = wrap ? wrap.querySelector('iframe') : null;
        if (!iframe) return;

        if (iframe.requestFullscreen) {
          iframe.requestFullscreen();
          return;
        }

        const src = iframe.getAttribute('src');
        if (src) window.open(src, '_blank', 'noopener,noreferrer');
      });
    });
  </script>
</body>
</html>
