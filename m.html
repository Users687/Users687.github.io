<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player</title>
  <style>
    :root{
      --bg: #0b1220;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.08);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --border: rgba(255,255,255,.16);
      --shadow: rgba(0,0,0,.35);
      --accent: #7c5cff;
      --accent2: #20d3ff;
      --focus: rgba(124,92,255,.45);

      --inputBg: rgba(255,255,255,.06);
      --selectBg: rgba(255,255,255,.06);
      --selectText: rgba(255,255,255,.92);
      --selectBorder: rgba(255,255,255,.16);
    }

    html[data-theme="light"]{
      --bg: #f5f7ff;
      --panel: rgba(0,0,0,.04);
      --panel2: rgba(0,0,0,.06);
      --text: rgba(0,0,0,.88);
      --muted: rgba(0,0,0,.58);
      --border: rgba(0,0,0,.12);
      --shadow: rgba(0,0,0,.08);
      --accent: #5a3dff;
      --accent2: #008fcf;
      --focus: rgba(90,61,255,.35);

      --inputBg: rgba(0,0,0,.03);
      --selectBg: rgba(0,0,0,.03);
      --selectText: rgba(0,0,0,.88);
      --selectBorder: rgba(0,0,0,.12);
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% 0%, rgba(124,92,255,.22), transparent 55%),
        radial-gradient(900px 500px at 90% 10%, rgba(32,211,255,.18), transparent 55%),
        var(--bg);
      padding:18px;
    }

    .wrap{ max-width: 1040px; margin:0 auto; }

    .hero{
      display:flex; gap:14px; align-items:center; justify-content:space-between;
      margin-bottom:14px; flex-wrap:wrap;
    }
    .title{ display:flex; flex-direction:column; gap:2px; }
    .title h1{ margin:0; font-size:20px; letter-spacing:.2px; }
    .title p{ margin:0; color: var(--muted); font-size:13px; }

    .toolbar{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
    }

    .pill{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:14px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 10px 22px var(--shadow);
      backdrop-filter: blur(10px);
    }

    select, input[type="text"]{
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--selectBorder);
      background: var(--selectBg);
      color: var(--selectText);
      outline:none;
    }

    select:focus, input[type="text"]:focus{
      border-color: rgba(124,92,255,.65);
      box-shadow: 0 0 0 4px var(--focus);
    }

    button{
      border:0;
      background: linear-gradient(135deg, var(--accent), rgba(32,211,255,.9));
      color:#fff;
      padding: 11px 14px;
      border-radius: 14px;
      cursor:pointer;
      font-weight:650;
      letter-spacing:.1px;
      box-shadow: 0 12px 24px rgba(124,92,255,.22);
      transition: transform .08s ease, filter .15s ease;
    }
    button:hover{ filter: brightness(1.03); }
    button:active{ transform: translateY(1px); }
    button:disabled{
      opacity:.55; cursor:not-allowed;
      box-shadow:none; filter:none;
    }

    .grid{
      display:grid; gap:14px;
      grid-template-columns: 1fr;
      margin-top:14px;
    }
    @media (min-width: 900px){
      .grid{ grid-template-columns: 1fr 1fr; }
      .playerRow{ grid-column: 1 / -1; }
    }

    .box{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius:18px;
      padding:14px;
      box-shadow: 0 12px 26px var(--shadow);
      backdrop-filter: blur(10px);
    }

    .boxHeader{
      display:flex; align-items:baseline; justify-content:space-between; gap:10px;
      margin-bottom:10px;
    }
    .box h2{ margin:0; font-size:15px; letter-spacing:.2px; }
    .smallMuted{ margin:0; font-size:12px; color: var(--muted); }
    .fields{ display:grid; gap:10px; grid-template-columns: 1fr; }
    .twoCols{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }

    .urlLine{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px dashed var(--border);
      background: var(--panel2);
      color: var(--muted);
      font-size: 12.5px;
      word-break: break-word;
      min-height: 42px;
      display:flex; align-items:center;
    }

    iframe{
      width:100%;
      border:0;
      border-radius:16px;
      aspect-ratio:16/9;
      background:#000;
    }

    .footerLine{
      margin-top:10px;
      color: var(--muted);
      font-size: 12.5px;
      word-break: break-word;
    }

    .hide{ display:none; }

    /* Switch */
    .toggleSwitch{
      position:relative;
      width:44px; height:26px;
      background: var(--inputBg);
      border:1px solid var(--border);
      border-radius:999px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      padding:2px;
      transition: background .15s ease, border-color .15s ease;
      user-select:none;
    }
    .toggleKnob{
      width:22px; height:22px;
      border-radius:999px;
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.75));
      transform: translateX(0);
      transition: transform .18s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,.18);
    }
    html[data-theme="light"] .toggleKnob{
      background: linear-gradient(180deg, rgba(255,255,255,1), rgba(235,240,255,.9));
    }
    .toggleSwitch[data-on="true"]{
      background: rgba(124,92,255,.18);
      border-color: rgba(124,92,255,.35);
    }
    .toggleSwitch[data-on="true"] .toggleKnob{
      transform: translateX(18px);
      background: linear-gradient(180deg, rgba(124,92,255,1), rgba(90,61,255,.8));
    }

    .switchRow{
      display:flex; align-items:center; gap:10px;
      user-select:none;
    }
    .switchText{ color: var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="title">
        <h1>Player</h1>
        <p>Movie or TV embeds</p>
      </div>

      <div class="toolbar">
        <div class="pill">
          <div class="switchRow">
            <span class="switchText">Autoplay</span>
            <span class="toggleSwitch" id="autoPlaySwitch" data-on="true" role="switch" tabindex="0" aria-label="Autoplay toggle">
              <span class="toggleKnob"></span>
            </span>
          </div>
          <input id="autoPlayToggle" type="checkbox" checked style="display:none;" />
        </div>

        <div class="pill">
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="switchText" style="min-width:44px;">Mode</span>
            <select id="modeToggle" aria-label="Movie or TV mode" style="width: 160px;">
              <option value="movie" selected>Movie</option>
              <option value="tv">TV</option>
            </select>
          </div>
        </div>

        <div class="pill">
          <div class="switchRow">
            <span class="switchText" id="themeLabel">Dark</span>
            <span class="toggleSwitch" id="themeSwitch" data-on="true" role="switch" tabindex="0" aria-label="Theme toggle">
              <span class="toggleKnob"></span>
            </span>
          </div>
          <input id="themeToggle" type="checkbox" checked style="display:none;" />
        </div>

        <div class="pill">
          <button id="loadBtn" type="button">Load</button>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="box" id="movieBox">
        <div class="boxHeader">
          <div>
            <h2>Movie</h2>
            <p class="smallMuted">Enter movie id ({Id})</p>
          </div>
          <div class="smallMuted">Embed</div>
        </div>

        <div class="fields">
          <div>
            <label class="smallMuted" for="movieId" style="display:block; margin-bottom:6px;">Movie ID</label>
            <input id="movieId" type="text" placeholder="e.g. 12345" />
          </div>
          <div class="urlLine" id="movieUrlPreview">Movie URL: —</div>
        </div>
      </div>

      <div class="box" id="tvBox">
        <div class="boxHeader">
          <div>
            <h2>TV Episode</h2>
            <p class="smallMuted">Enter tv id + season + episode ({season}/{episode})</p>
          </div>
        </div>

        <div class="fields">
          <div>
            <label class="smallMuted" for="tvId" style="display:block; margin-bottom:6px;">TV Show ID</label>
            <input id="tvId" type="text" placeholder="e.g. 67890" />
          </div>

          <div class="twoCols">
            <div>
              <label class="smallMuted" for="season" style="display:block; margin-bottom:6px;">Season</label>
              <input id="season" type="text" placeholder="e.g. 1" />
            </div>
            <div>
              <label class="smallMuted" for="episode" style="display:block; margin-bottom:6px;">Episode</label>
              <input id="episode" type="text" placeholder="e.g. 2" />
            </div>
          </div>

          <div class="urlLine" id="tvUrlPreview">TV URL: —</div>
        </div>
      </div>

      <div class="box playerRow">
        <div class="boxHeader">
          <div>
            <h2>Player</h2>
            <p class="smallMuted">Press Load to embed the selected URL</p>
          </div>
          <div class="smallMuted" id="activeUrlLabel">Ready</div>
        </div>

        <!-- Important: no srcdoc, just a blank iframe that gets src on Load -->
        <iframe id="player" title="Player" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <div class="footerLine" id="activeUrl">Active URL: —</div>
      </div>
    </div>
  </div>

  <script>
    const autoPlayToggle = document.getElementById('autoPlayToggle');
    const autoPlaySwitch = document.getElementById('autoPlaySwitch');

    const modeToggle = document.getElementById('modeToggle');

    const themeToggle = document.getElementById('themeToggle');
    const themeSwitch = document.getElementById('themeSwitch');
    const themeLabel = document.getElementById('themeLabel');

    const loadBtn = document.getElementById('loadBtn');

    const movieBox = document.getElementById('movieBox');
    const tvBox = document.getElementById('tvBox');

    const movieId = document.getElementById('movieId');
    const tvId = document.getElementById('tvId');
    const season = document.getElementById('season');
    const episode = document.getElementById('episode');

    const player = document.getElementById('player');

    const movieUrlPreview = document.getElementById('movieUrlPreview');
    const tvUrlPreview = document.getElementById('tvUrlPreview');
    const activeUrl = document.getElementById('activeUrl');
    const activeUrlLabel = document.getElementById('activeUrlLabel');

    function trim(v){ return (v ?? '').toString().trim(); }
    function getAutoPlayParam(){ return autoPlayToggle.checked ? 'true' : 'false'; }

    function syncSwitchUI() {
      autoPlaySwitch.dataset.on = autoPlayToggle.checked ? 'true' : 'false';
      themeSwitch.dataset.on = themeToggle.checked ? 'true' : 'false';
      themeLabel.textContent = themeToggle.checked ? 'Dark' : 'Light';
    }

    function setTheme(theme){ // 'dark' | 'light'
      themeToggle.checked = theme === 'dark';
      syncSwitchUI();
      document.documentElement.dataset.theme = theme;
    }

    // Init theme
    (function initTheme(){
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      setTheme(prefersLight ? 'light' : 'dark');
    })();

    function refreshModeUI(){
      const mode = modeToggle.value;
      const isMovie = mode === 'movie';
      movieBox.classList.toggle('hide', !isMovie);
      tvBox.classList.toggle('hide', isMovie);

      const mId = trim(movieId.value);
      const tId = trim(tvId.value);
      const s = trim(season.value);
      const e = trim(episode.value);

      const canMovie = !!mId;
      const canTv = !!(tId && s && e);

      loadBtn.disabled = !(isMovie ? canMovie : canTv);
      activeUrlLabel.textContent = 'Ready';
    }

    function updatePreviews(){
      const ap = getAutoPlayParam();

      const mId = trim(movieId.value);
      movieUrlPreview.textContent = mId
        ? `Movie URL: https://vidfast.vc/movie/${encodeURIComponent(mId)}?autoPlay=${ap}`
        : 'Movie URL: —';

      const t = trim(tvId.value);
      const s = trim(season.value);
      const e = trim(episode.value);
      tvUrlPreview.textContent =
        (t && s && e)
          ? `TV URL: https://vidfast.vc/tv/${encodeURIComponent(t)}/${encodeURIComponent(s)}/${encodeURIComponent(e)}?autoPlay=${ap}`
          : 'TV URL: —';
    }

    function load(){
      const ap = getAutoPlayParam();
      const mode = modeToggle.value;

      const mId = trim(movieId.value);
      const tId = trim(tvId.value);
      const s = trim(season.value);
      const e = trim(episode.value);

      let url = null;

      if(mode === 'movie'){
        if(!mId){
          activeUrl.textContent = 'Active URL: Enter a Movie ID to load.';
          activeUrlLabel.textContent = 'Missing ID';
          return;
        }
        url = `https://vidfast.vc/movie/${encodeURIComponent(mId)}?autoPlay=${ap}`;
      } else {
        if(!(tId && s && e)){
          activeUrl.textContent = 'Active URL: Enter TV ID, season, and episode to load.';
          activeUrlLabel.textContent = 'Missing info';
          return;
        }
        url = `https://vidfast.vc/tv/${encodeURIComponent(tId)}/${encodeURIComponent(s)}/${encodeURIComponent(e)}?autoPlay=${ap}`;
      }

      // Clear first to force reload in some browsers
      player.removeAttribute('src');
      player.src = url;

      activeUrl.textContent = `Active URL: ${url}`;
      activeUrlLabel.textContent = 'Loading…';
    }

    // Switches
    function toggleAutoplay(){
      autoPlayToggle.checked = !autoPlayToggle.checked;
      syncSwitchUI();
      updatePreviews();
      refreshModeUI();
    }
    function toggleTheme(){
      setTheme(themeToggle.checked ? 'light' : 'dark');
      // no other changes needed; CSS variables handle it
    }

    autoPlaySwitch.addEventListener('click', toggleAutoplay);
    autoPlaySwitch.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAutoplay(); }
    });

    themeSwitch.addEventListener('click', toggleTheme);
    themeSwitch.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
    });

    // Inputs
    [movieId, tvId, season, episode].forEach(el => {
      el.addEventListener('input', () => {
        updatePreviews();
        refreshModeUI();
      });
    });

    modeToggle.addEventListener('change', () => {
      updatePreviews();
      refreshModeUI();
    });

    loadBtn.addEventListener('click', load);

    // Initial
    syncSwitchUI();
    updatePreviews();
    refreshModeUI();
  </script>
</body>
</html>
