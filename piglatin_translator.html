<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pig Latin Translator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f4f4f9;
    }
    textarea, input, button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 80%;
      max-width: 400px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    #output {
      margin-top: 20px;
      font-size: 1.2em;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>English ➡ Pig Latin</h1>
  <textarea id="inputText" rows="4" placeholder="Type your sentence here..."></textarea><br>
  <button onclick="translateToPigLatin()">Translate</button>
  <div id="output"></div>

  <script>
    function toPigLatin(word) {
      const vowels = ["a", "e", "i", "o", "u"];
      word = word.toLowerCase();

      if (vowels.includes(word[0])) {
        return word + "yay";
      }

      for (let i = 0; i < word.length; i++) {
        if (vowels.includes(word[i])) {
          return word.slice(i) + word.slice(0, i) + "ay";
        }
      }

      return word + "ay";
    }

    function translateToPigLatin() {
      const input = document.getElementById("inputText").value;
      const words = input.split(/\s+/);
      const pigLatinSentence = words.map(toPigLatin).join(" ");
      document.getElementById("output").innerText = pigLatinSentence;
    }
  </script>
</body>
</html>
